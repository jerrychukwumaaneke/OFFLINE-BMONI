<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMONI Login Gate</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 33, 54, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b, var(--bg-color));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #040814;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Agent Sign In</h1>
        <p class="subtitle">Enter credentials to unlock dashboard</p>
        
        <div class="error-message" id="error-box"></div>

        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="john.doe@example.com" autofocus>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
                <a href="/forgot-password" style="display: block; text-align: right; font-size: 0.85rem; color: var(--text-muted); text-decoration: none; margin-top: 0.5rem; transition: color 0.2s ease;" onmouseover="this.style.color='#00f2fe'" onmouseout="this.style.color='#94a3b8'">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-submit">Authenticate</button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorBox = document.getElementById("error-box");
            
            errorBox.style.display = "none";
            
            const API_URL = window.location.hostname.includes("vercel.app") ? "https://offline-bmoni.onrender.com" : "";
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ email, password }),
                    credentials: 'include'
                });
                
                if (res.ok) {
                    window.location.href = "/";
                } else {
                    const data = await res.json();
                    errorBox.textContent = data.detail || "Authentication failed.";
                    errorBox.style.display = "block";
                }
            } catch (err) {
                errorBox.textContent = "Failed to communicate with server.";
                errorBox.style.display = "block";
            }
        }
        async function checkRegistration() {
            const API_URL = window.location.hostname.includes("vercel.app") ? "https://offline-bmoni.onrender.com" : "";
            try {
                const res = await fetch(`${API_URL}/api/status-unprotected`);
                const data = await res.json();
                if (!data.registered) {
                    window.location.href = "/register";
                }
            } catch (err) {
                console.error("Error checking registration:", err);
            }
        }
        checkRegistration();
    </script>
</body>
</html>
