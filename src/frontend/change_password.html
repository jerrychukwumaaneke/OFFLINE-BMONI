<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Custom Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 33, 54, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b, var(--bg-color));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .reset-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .warning-banner {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #040814;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <h1>Update Default Password</h1>
        <p class="subtitle">Secure your Agent Relay Node before proceeding</p>
        
        <div class="warning-banner">
            ⚠️ You are logged in with the <strong>temporary default password</strong>. For security, you must choose a new password before you can view the dashboard.
        </div>

        <div class="error-message" id="error-box"></div>

        <form onsubmit="handleChangePassword(event)">
            <div class="input-group">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" required minlength="8" placeholder="At least 8 characters" autofocus>
            </div>
            
            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required minlength="8" placeholder="Retype new password">
            </div>
            
            <button type="submit" class="btn-submit">Save Password & Continue</button>
        </form>
    </div>

    <script>
        async function handleChangePassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const errorBox = document.getElementById("error-box");
            
            errorBox.style.display = "none";
            
            if (newPassword !== confirmPassword) {
                errorBox.textContent = "Passwords do not match.";
                errorBox.style.display = "block";
                return;
            }
            
            const API_URL = window.location.hostname.includes("vercel.app") ? "https://offline-bmoni.onrender.com" : "";
            try {
                const res = await fetch(`${API_URL}/change-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({ new_password: newPassword })
                });
                
                if (res.ok) {
                    window.location.href = "/";
                } else {
                    const data = await res.json();
                    errorBox.textContent = data.detail || "Failed to update password.";
                    errorBox.style.display = "block";
                }
            } catch (err) {
                errorBox.textContent = "Failed to communicate with server.";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
