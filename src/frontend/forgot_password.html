<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 33, 54, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #00f2fe;
            --secondary: #4facfe;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b, var(--bg-color));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .recovery-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(16px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.8rem 1.1rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #040814;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 12px;
            padding: 0.8rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter details to recover agent account</p>
        
        <div class="error-message" id="error-box"></div>
        <div class="success-message" id="success-box"></div>

        <form onsubmit="handleReset(event)" id="reset-form">
            <div class="input-group">
                <label for="email">Registered Email</label>
                <input type="email" id="email" required placeholder="john.doe@example.com">
            </div>

            <div class="input-group">
                <label for="recovery-pass">Staff Default Password</label>
                <input type="password" id="recovery-pass" required placeholder="Temporary BMONI password">
            </div>

            <div class="input-group">
                <label for="new-pass">New Custom Password</label>
                <input type="password" id="new-pass" required placeholder="Minimum 8 characters">
            </div>
            
            <button type="submit" class="btn-submit">Reset Credentials</button>
        </form>

        <a href="/login" class="back-link">Back to Sign In</a>
    </div>

    <script>
        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const recoveryPass = document.getElementById("recovery-pass").value;
            const newPass = document.getElementById("new-pass").value;
            const errorBox = document.getElementById("error-box");
            const successBox = document.getElementById("success-box");
            
            errorBox.style.display = "none";
            successBox.style.display = "none";
            
            if (newPass.length < 8) {
                errorBox.textContent = "New password must be at least 8 characters.";
                errorBox.style.display = "block";
                return;
            }
            
            const API_URL = window.location.hostname.includes("vercel.app") ? "https://offline-bmoni.onrender.com" : "";
            try {
                const res = await fetch(`${API_URL}/forgot-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        email: email,
                        recovery_password: recoveryPass,
                        new_password: newPass
                    })
                });
                
                if (res.ok) {
                    successBox.textContent = "Password reset successfully! Redirecting to login...";
                    successBox.style.display = "block";
                    document.getElementById("reset-form").style.display = "none";
                    setTimeout(() => {
                        window.location.href = "/login";
                    }, 2000);
                } else {
                    const data = await res.json();
                    errorBox.textContent = data.detail || "Reset failed.";
                    errorBox.style.display = "block";
                }
            } catch (err) {
                errorBox.textContent = "Failed to communicate with server.";
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
